name: Build and Push LLM Service Images

on:
  push:
    branches:
      - staging
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: fastapi
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/readeaze-images:${{ github.ref_name == 'master' && 'llm-latest' || format('llm-{0}', github.ref_name) }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: worker
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/readeaze-worker:${{ github.ref_name == 'master' && 'worker-latest' || format('worker-{0}', github.ref_name) }}
